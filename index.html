<!DOCTYPE html>
<html>
<head>
  <title>Test Supabase</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>🔍 Test Supabase</h1>
  <button onclick="testSupabase()">Tester</button>
  <pre id="result">Cliquez sur le bouton</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configuration Supabase
    const SUPABASE_URL = "https://fticplakkqyyyahnbqng.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Ncg05nIR1EqosVpq_BHmAg_BeHA5avS";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    console.log('✅ Supabase configuré', supabase);

    async function testSupabase() {
      const result = document.getElementById('result');
      result.textContent = '⏳ Chargement...';
      
      try {
        const { data, error } = await supabase.from('membres').select('*');
        if (error) throw error;
        result.textContent = '✅ Données reçues : ' + JSON.stringify(data, null, 2);
      } catch(e) {
        result.textContent = '❌ Erreur : ' + e.message;
        console.error(e);
      }
    }
  </script>
</body>
</html>
