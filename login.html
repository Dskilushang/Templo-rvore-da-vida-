<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Templo Árvore da Vida</title>
  <link rel="stylesheet" href="Style.css">
  <style>
    /* Styles spécifiques à la page de connexion */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a2a3a;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-container .logo {
      margin-bottom: 30px;
    }
    .login-container .logo h2 {
      color: #1a2a3a;
      font-size: 28px;
      letter-spacing: 2px;
      margin: 0;
    }
    .login-container .logo span {
      color: #777;
      font-size: 14px;
    }
    .login-container .logo .highlight {
      color: #f1c40f;
    }
    .login-container input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .login-container input:focus {
      border-color: #f1c40f;
      outline: none;
    }
    .login-container button {
      width: 100%;
      padding: 12px;
      background: #1a2a3a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-container button:hover {
      background: #2c3e50;
    }
    .login-container .error {
      color: #dc3545;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    .login-container .error.show {
      display: block;
    }
    .login-container .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <h2>Templo <span class="highlight">Árvore</span></h2>
      <span>da Vida</span>
    </div>
    
    <h3 style="margin-bottom: 20px; color: #555;">🔐 Connexion Admin</h3>
    
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <input type="password" id="passwordInput" placeholder="Entrez le mot de passe" required autofocus>
      <button type="submit">Se connecter</button>
    </form>
    
    <div class="error" id="errorMessage">
      ❌ Mot de passe incorrect. Veuillez réessayer.
    </div>
    
    <div class="footer">
      ⚡ Accès réservé aux administrateurs
    </div>
  </div>

  <script>
    // Mot de passe admin (à changer selon vos besoins)
    const ADMIN_PASSWORD = 'admin123';
    
    function handleLogin(event) {
      event.preventDefault();
      const password = document.getElementById('passwordInput').value;
      const errorDiv = document.getElementById('errorMessage');
      
      if (password === ADMIN_PASSWORD) {
        // Mot de passe correct : sauvegarder la session
        sessionStorage.setItem('isLoggedIn', 'true');
        // Rediriger vers le tableau de bord
        window.location.href = 'index.html';
      } else {
        // Mot de passe incorrect
        errorDiv.classList.add('show');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
        // Cacher l'erreur après 3 secondes
        setTimeout(() => {
          errorDiv.classList.remove('show');
        }, 3000);
      }
      return false;
    }
    
    // Si l'utilisateur est déjà connecté, le rediriger directement
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }
  </script>

</body>
  </html>
