<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.A.V - Templo Árvore da Vida</title>
  <link rel="stylesheet" href="Style.css">
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <!-- ============= SIDEBAR (MENU LATÉRAL) ============= -->
  <aside id="sidebar">
    <div class="logo">
      <h2>T.A.V</h2>
      <span>Templo Árvore da Vida</span>
    </div>
    <nav>
      <ul>
        <li class="active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Tableau de bord</li>
        <li data-page="vitrine"><i class="fas fa-home"></i> Vitrine</li>
        <li data-page="portfolio"><i class="fas fa-images"></i> Portfolio</li>
        <li data-page="contact"><i class="fas fa-envelope"></i> Contact</li>
        <li data-page="departements"><i class="fas fa-users-cog"></i> Départements</li>
        <li data-page="membres"><i class="fas fa-user-friends"></i> Membres</li>
        <li data-page="rapports"><i class="fas fa-file-alt"></i> Rapports</li>
        <li data-page="annonces"><i class="fas fa-bullhorn"></i> Annonces</li>
      </ul>
    </nav>
    <div class="bottom-links">
      <a href="#"><i class="fas fa-cog"></i> Paramètres</a>
      <a href="#"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
    </div>
  </aside>

  <!-- ============= CONTENU PRINCIPAL ============= -->
  <main id="main-content">

    <!-- En-tête -->
    <header>
      <h1 id="page-title">Tableau de bord</h1>
      <div class="header-right">
        <span><i class="fas fa-bell"></i></span>
        <span><i class="fas fa-user-circle"></i> Admin</span>
      </div>
    </header>

    <!-- Zone de contenu dynamique (changera quand on clique sur un menu) -->
    <section id="content-area">
      <!-- Le contenu sera injecté ici par JavaScript -->
    </section>

  </main>

  <!-- ============= SCRIPTS ============= -->
  <!-- 1. Les données (data.js) -->
  <script src="data.js"></script>
  <!-- 2. La logique (Scripts.js) - Attention au nom exact avec le S majuscule -->
  <script src="Scripts.js"></script>
</body>
    </html>
