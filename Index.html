<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templo Árvore da Vida</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <aside id="sidebar">
    <div class="logo">
      <h2>Templo</h2>
      <span>Árvore da Vida</span>
    </div>
    <nav>
      <ul>
        <li class="active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> <span data-i18n="menu.dashboard">Tableau de bord</span></li>
        <li data-page="vitrine"><i class="fas fa-home"></i> <span data-i18n="menu.vitrine">Vitrine</span></li>
        <li data-page="portfolio"><i class="fas fa-images"></i> <span data-i18n="menu.portfolio">Portfolio</span></li>
        <li data-page="contact"><i class="fas fa-envelope"></i> <span data-i18n="menu.contact">Contact</span></li>
        <li data-page="departements"><i class="fas fa-users-cog"></i> <span data-i18n="menu.departements">Départements</span></li>
        <li data-page="membres"><i class="fas fa-user-friends"></i> <span data-i18n="menu.membres">Membres</span></li>
        <li data-page="rapports"><i class="fas fa-file-alt"></i> <span data-i18n="menu.rapports">Rapports</span></li>
        <li data-page="annonces"><i class="fas fa-bullhorn"></i> <span data-i18n="menu.annonces">Annonces</span></li>
      </ul>
    </nav>
    <div class="bottom-links">
      <a href="#"><i class="fas fa-cog"></i> <span data-i18n="menu.parametres">Paramètres</span></a>
      <a href="#"><i class="fas fa-sign-out-alt"></i> <span data-i18n="menu.deconnexion">Déconnexion</span></a>
    </div>
  </aside>

  <main id="main-content">
    <header>
      <h1 id="page-title">Tableau de bord</h1>
      <div class="header-right">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="fr" onclick="setLanguage('fr')">FR</button>
          <button class="lang-btn" data-lang="pt" onclick="setLanguage('pt')">PT</button>
        </div>
        <span><i class="fas fa-bell"></i></span>
        <span><i class="fas fa-user-circle"></i> <span id="admin-label">Admin</span></span>
      </div>
    </header>
    <section id="content-area"></section>
  </main>

  <script src="translations.js"></script>
  <script src="data.js"></script>
  <script src="Scripts.js"></script>
</body>
  </html>
